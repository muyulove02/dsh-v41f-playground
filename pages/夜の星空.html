<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>娱乐场地 · 夜间星空</title>
<style>
  :root{
    --bg:#050510;
    --bg2:#0a0a1f;
    --ink:#e8e6ff;
    --dim:#8a86b8;
    --accent:#7c6cff;
    --accent2:#ff6c9d;
    --warm:#ffd479;
    --line:rgba(124,108,255,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at 50% 0%,#12122e 0%,var(--bg2) 40%,var(--bg) 100%);
    color:var(--ink);
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    overflow:hidden;user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;cursor:crosshair}

  /* 顶部 */
  header{
    position:fixed;top:0;left:0;right:0;
    padding:18px 26px 14px;
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    background:linear-gradient(180deg,rgba(5,5,16,.9),transparent);
    z-index:10;pointer-events:none;
  }
  header h1{font-size:15px;font-weight:600;letter-spacing:.28em;color:var(--ink);opacity:.92}
  header .sub{font-size:11.5px;color:var(--dim);letter-spacing:.08em}
  header .clock{
    margin-left:auto;font-size:11.5px;color:var(--dim);
    font-variant-numeric:tabular-nums;letter-spacing:.06em;
  }

  /* 底部控件 */
  footer{
    position:fixed;bottom:0;left:0;right:0;
    padding:14px 26px 20px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    background:linear-gradient(0deg,rgba(5,5,16,.92),transparent);
    z-index:10;
  }
  button{
    font:inherit;font-size:12px;letter-spacing:.06em;
    color:var(--ink);background:rgba(124,108,255,.10);
    border:1px solid var(--line);border-radius:999px;
    padding:8px 16px;cursor:pointer;
    transition:background .22s,border-color .22s,color .22s,transform .12s;
    backdrop-filter:blur(6px);
  }
  button:hover{background:rgba(124,108,255,.24);border-color:rgba(124,108,255,.45);color:#fff}
  button:active{transform:scale(.97)}
  button.on{background:rgba(255,108,157,.18);border-color:rgba(255,108,157,.5)}

  /* 随机引用面板 */
  #quote{
    position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(14px);
    max-width:min(680px,88vw);
    padding:18px 24px;border-radius:16px;
    background:rgba(12,12,32,.86);
    border:1px solid var(--line);
    box-shadow:0 18px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.02) inset;
    backdrop-filter:blur(14px);
    opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;
    z-index:12;
  }
  #quote.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #quote .qsrc{font-size:10.5px;letter-spacing:.14em;color:var(--accent2);margin-bottom:8px;text-transform:uppercase}
  #quote .qtext{font-size:13.5px;line-height:1.85;color:#d9d6ff;white-space:pre-wrap}

  /* 悬停气泡 */
  #tip{
    position:fixed;pointer-events:none;z-index:14;
    padding:7px 12px;border-radius:10px;
    background:rgba(8,8,22,.92);border:1px solid var(--line);
    font-size:11.5px;letter-spacing:.04em;color:#cfcbff;
    opacity:0;transition:opacity .18s;white-space:nowrap;
    transform:translate(14px,-50%);
  }
  #tip.show{opacity:1}
  #tip .ttime{color:var(--warm);font-variant-numeric:tabular-nums}

  /* 时间轴刻度 */
  #axis{
    position:fixed;bottom:64px;left:26px;right:26px;height:1px;
    background:linear-gradient(90deg,transparent,var(--line) 8%,var(--line) 92%,transparent);
    z-index:9;pointer-events:none;
  }
  #axis .tick{
    position:absolute;top:-3px;width:1px;height:7px;
    background:rgba(124,108,255,.35);
  }
  #axis .lab{
    position:absolute;top:10px;transform:translateX(-50%);
    font-size:9.5px;color:var(--dim);letter-spacing:.08em;
    font-variant-numeric:tabular-nums;
  }
  @media (max-width:640px){
    header h1{font-size:12px;letter-spacing:.18em}
    header .sub{display:none}
    footer{gap:10px;padding:10px 16px 16px}
    button{font-size:11px;padding:7px 12px}
    #axis{left:16px;right:16px}
  }
</style>

/* ============================================================ */
const cv = document.getElementById('sky');
const ctx = cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', ()=>{ resize(); layout(); });

/* --- 星星对象 --- */
let stars = [];
let dust = [];
let mode = 'cloud';        // cloud | time | special
let specialOnly = false;

function makeDust(){
  dust = [];
  const n = Math.round((W*H)/9000);
  for(let i=0;i<n;i++){
    dust.push({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.1+0.2,
      a: Math.random()*0.5+0.15,
      ph: Math.random()*Math.PI*2,
      sp: 0.0004+Math.random()*0.0009
    });
  }
}

function layout(){
  const cx = W*0.5, cy = H*0.52;
  const R  = Math.min(W,H)*0.40;

  // ---- cloud（星云：螺旋） ----
  stars = FILES.map((f,i)=>{
    const a = i * 0.618 * Math.PI*2 + f.t*2.4;
    const r = R * (0.16 + 0.84*Math.pow(i/Math.max(1,FILES.length-1), 0.62));
    const jx = (Math.sin(i*12.9898)*43758.5453 % 1);
    const jy = (Math.sin(i*78.233)*12345.6789 % 1);
    return {
      ...f,
      kind:'file',
      x0: cx + Math.cos(a)*r + jx*40,
      y0: cy + Math.sin(a)*r*0.82 + jy*40,
      x1: 0, y1: 0,
      x:0, y:0,
      r: 1.3 + Math.random()*1.6,
      ph: Math.random()*Math.PI*2
    };
  });

  // 时间轴模式：x 按 t 铺开，y 轻微抖动
  const padL = 54, padR = 54;
  FILES.forEach((f,i)=>{
    const st = stars[i];
    st.x1 = padL + (f.t/2.5)*(W-padL-padR);
    st.y1 = H*0.30 + Math.sin(i*1.7)*Math.min(150,H*0.16) + (i%3-1)*22;
  });

  // special 光点
  specialStars = SPECIAL.map((s,i)=>{
    const a = -Math.PI/2 + (i-1)*0.55;
    const r = R*0.98;
    return {
      ...s, kind:'special',
      x0: cx + Math.cos(a)*r,
      y0: cy + Math.sin(a)*r*0.82,
      x1: cx + Math.cos(a)*r*0.55,
      y1: cy + Math.sin(a)*r*0.55,
      r: 3.4,
      ph: 1+i
    };
  });

  applyMode(true);
}

/* 缓动过渡 */
let transT = 1;  // 0 -> 1
function applyMode(instant){
  transT = instant ? 1 : 0;
  const arr = [...stars, ...specialStars];
  arr.forEach(s=>{
    if(instant){ s.x = targetX(s); s.y = targetY(s); }
  });
  buildAxis();
}
function targetX(s){
  if(mode==='time') return s.x1 !== undefined ? s.x1 : s.x0;
  if(mode==='special') return s.kind==='special' ? s.x1 : W*0.5 + (Math.random()-0.5)*20;
  return s.x0;
}
function targetY(s){
  if(mode==='time') return s.y1 !== undefined ? s.y1 : s.y0;
  if(mode==='special') return s.kind==='special' ? s.y1 : H*0.5;
  return s.y0;
}

let specialStars = [];

/* 时间轴刻度 */
function buildAxis(){
  const ax = document.getElementById('axis');
  ax.innerHTML = '';
  if(mode!=='time'){ ax.style.opacity='0'; return; }
  ax.style.opacity='1';
  const padL=54, padR=54;
  const span = 2.5; // 0 分 .. 2.5 分标度（不代表分钟，只是标度）
  const marks = [0,0.5,1.0,1.5,2.0,2.5];
  const labels = ['00:27','01:16','01:55','02:10','02:30','02:47'];
  marks.forEach((m,i)=>{
    const p = (m/span)*100;
    const tick = document.createElement('div');
    tick.className='tick';
    tick.style.left = `calc(${p}% )`;
    ax.appendChild(tick);
    const lab = document.createElement('div');
    lab.className='lab';
    lab.textContent = labels[i];
    lab.style.left = `calc(${p}%)`;
    ax.appendChild(lab);
  });
}

/* --- 交互 --- */
let mx=-9999, my=-9999, hover=null;
const tip = document.getElementById('tip');
cv.addEventListener('mousemove', e=>{
  mx=e.clientX; my=e.clientY;
  hover=null;
  let best=1e9;
  for(const s of [...stars, ...specialStars]){
    const d = Math.hypot(s.x-mx, s.y-my);
    const rr = (s.kind==='special'?16:9);
    if(d<rr && d<best){ best=d; hover=s; }
  }
  if(hover){
    tip.classList.add('show');
    tip.style.left = mx+'px';
    tip.style.top  = my+'px';
    const label = hover.kind==='special'
      ? `<span class="ttime">✦</span> ${hover.n}`
      : `${hover.n} <span class="ttime">· ${hover.s}</span>`;
    tip.innerHTML = label;
  } else {
    tip.classList.remove('show');
  }
});
cv.addEventListener('mouseleave', ()=>{ tip.classList.remove('show'); mx=-9999; my=-9999; });

cv.addEventListener('click', ()=>{
  if(hover && hover.kind==='file'){
    showQuote(hover.n, hover.s + ' —— 我今晚写到这一篇。');
  } else if(hover && hover.kind==='special'){
    showQuote(hover.n, '这件东西是你放进来的。');
  }
});

/* --- 随机引用 --- */
let quoteTimer=null;
function showQuote(src, text){
  const q = document.getElementById('quote');
  document.getElementById('qsrc').textContent = src;
  document.getElementById('qtext').textContent = text;
  q.classList.add('show');
  clearTimeout(quoteTimer);
  quoteTimer = setTimeout(()=>q.classList.remove('show'), 11000);
}
document.getElementById('btnQuote').addEventListener('click', ()=>{
  const q = QUOTES[Math.floor(Math.random()*QUOTES.length)];
  showQuote(q[0], q[1]);
});

/* --- 按钮 --- */
document.getElementById('btnStar').addEventListener('click', ()=>{
  mode='cloud'; specialOnly=false;
  // 重新抖一次形状
  const cx=W*0.5, cy=H*0.52, R=Math.min(W,H)*0.40;
  stars.forEach((s,i)=>{
    const a = Math.random()*Math.PI*2;
    const r = R*(0.18+0.82*Math.sqrt(Math.random()));
    s.x0 = cx+Math.cos(a)*r; s.y0 = cy+Math.sin(a)*r*0.82;
  });
  applyMode(false);
});
document.getElementById('btnTime').addEventListener('click', ()=>{
  mode = (mode==='time') ? 'cloud' : 'time';
  document.getElementById('btnTime').classList.toggle('on', mode==='time');
  applyMode(false);
});
document.getElementById('btnSpecial').addEventListener('click', ()=>{
  mode = (mode==='special') ? 'cloud' : 'special';
  document.getElementById('btnSpecial').classList.toggle('on', mode==='special');
  applyMode(false);
});

/* --- 时钟 --- */
function tickClock(){
  const d = new Date();
  const p = n=>String(n).padStart(2,'0');
  document.getElementById('clock').textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
setInterval(tickClock, 1000); tickClock();

/* ============================================================
   渲染
   ============================================================ */
let t0 = performance.now();

function frame(now){
  const t = (now-t0);

  // 过渡
  if(transT < 1){
    transT = Math.min(1, transT + 0.02);
  }
  const e = transT<1 ? (1-Math.pow(1-transT,3)) : 1;

  ctx.clearRect(0,0,W,H);

  // 尘埃
  for(const d of dust){
    const tw = 0.55 + 0.45*Math.sin(t*d.sp + d.ph);
    ctx.beginPath();
    ctx.arc(d.x,d.y,d.r,0,7);
    ctx.fillStyle = `rgba(200,196,255,${d.a*tw*0.55})`;
    ctx.fill();
  }

  // 位置缓动
  for(const s of [...stars, ...specialStars]){
    const tx = transT<1 ? (s._sx!==undefined && transT<0.02 ? s._sx : targetX(s)) : targetX(s);
    if(transT<0.02){ s._sx = s.x; s._sy = s.y; }
    const gx = (s._tx===undefined) ? targetX(s) : targetX(s);
    s.x += (gx - s.x) * 0.12;
    const gy = targetY(s);
    s.y += (gy - s.y) * 0.12;
  }

  // 连线：相邻时间相近的星
  ctx.lineWidth = 0.6;
  for(let i=0;i<stars.length-1;i++){
    const a=stars[i], b=stars[i+1];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    if(d < Math.min(W,H)*0.30){
      const al = Math.max(0, 0.16*(1-d/(Math.min(W,H)*0.30)));
      ctx.strokeStyle = `rgba(124,108,255,${al})`;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
  }

  // 星
  for(const s of stars){
    const tw = 0.72 + 0.28*Math.sin(t*0.0016 + s.ph);
    const isHover = (hover===s);
    const rr = s.r*(isHover?2.0:1)*tw;

    // 光晕
    const g = ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,rr*7);
    g.addColorStop(0, isHover?'rgba(255,220,180,.55)':'rgba(150,140,255,.42)');
    g.addColorStop(1, 'rgba(124,108,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(s.x,s.y,rr*7,0,7); ctx.fill();

    // 核
    ctx.beginPath(); ctx.arc(s.x,s.y,rr,0,7);
    ctx.fillStyle = isHover ? '#fff3d9' : 'rgba(232,230,255,.92)';
    ctx.fill();
  }

  // 三样特别的东西
  for(const s of specialStars){
    const isHover = (hover===s);
    const pulse = 0.7 + 0.3*Math.sin(t*0.0012 + s.ph);
    const rr = s.r*(isHover?1.7:1)*pulse;

    const g = ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,rr*9);
    g.addColorStop(0, hexA(s.c, isHover?0.55:0.34));
    g.addColorStop(1, hexA(s.c,0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(s.x,s.y,rr*9,0,7); ctx.fill();

    ctx.beginPath(); ctx.arc(s.x,s.y,rr,0,7);
    ctx.fillStyle = s.c; ctx.fill();

    // 一个极细的环
    ctx.beginPath(); ctx.arc(s.x,s.y, rr*3.4, 0, 7);
    ctx.strokeStyle = hexA(s.c,0.20); ctx.lineWidth=0.7; ctx.stroke();
  }

  requestAnimationFrame(frame);
}

function hexA(hex, a){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16);
  const g = parseInt(h.substring(2,4),16);
  const b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* 启动 */
resize();
makeDust();
layout();
requestAnimationFrame(frame);

/* 开场：先给一句 */
setTimeout(()=>{
  showQuote('娱乐场地','这个页面里没有结论。它只是把已经在这儿的东西，重新排了一遍。');
}, 900);
